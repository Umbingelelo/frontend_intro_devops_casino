name: Frontend CI/CD Pipeline

on:
  push:
    branches:
      - deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Construir imagen Docker
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/vidal-casino-frontend:latest .

      - name: Login en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Subir imagen a Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/vidal-casino-frontend:latest

      - name: Desplegar en AWS EC2 (Frontend)
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.AWS_FRONTEND_IP }}
          username: ec2-user
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            sudo dnf install -y docker
            sudo systemctl start docker
            sudo usermod -aG docker ec2-user
            sudo docker stop casino-frontend || true
            sudo docker rm casino-frontend || true
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/vidal-casino-frontend:latest
            sudo docker run -d --name casino-frontend -p 80:8080 -e BACKEND_HOST="${{ secrets.BACKEND_PRIVATE_IP }}" ${{ secrets.DOCKERHUB_USERNAME }}/vidal-casino-frontend:latest
