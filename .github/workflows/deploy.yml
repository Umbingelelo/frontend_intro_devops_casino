name: Deploy Frontend
on:
  push:
    branches:
      - deploy
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar AWS con Limpieza Absoluta
        run: |
          # Limpieza forzada de comillas, textos de etiquetas y saltos de linea
          CLEAN_KEY=$(echo "${{ secrets.AWS_ACCESS_KEY_ID }}" | sed -e 's/aws_access_key_id=//g' -e 's/"//g' | tr -d '\r\n ')
          CLEAN_SECRET=$(echo "${{ secrets.AWS_SECRET_ACCESS_KEY }}" | sed -e 's/aws_secret_access_key=//g' -e 's/"//g' | tr -d '\r\n ')
          CLEAN_TOKEN=$(echo "${{ secrets.AWS_SESSION_TOKEN }}" | sed -e 's/aws_session_token=//g' -e 's/"//g' | tr -d '\r\n ')

          mkdir -p ~/.aws
          echo "[default]" > ~/.aws/credentials
          echo "aws_access_key_id=$CLEAN_KEY" >> ~/.aws/credentials
          echo "aws_secret_access_key=$CLEAN_SECRET" >> ~/.aws/credentials
          echo "aws_session_token=$CLEAN_TOKEN" >> ~/.aws/credentials
          
          echo "[default]" > ~/.aws/config
          echo "region=us-east-1" >> ~/.aws/config

          # Validar configuracion minima de entorno
          export AWS_ACCESS_KEY_ID=$CLEAN_KEY
          export AWS_SECRET_ACCESS_KEY=$CLEAN_SECRET
          export AWS_SESSION_TOKEN=$CLEAN_TOKEN
          export AWS_DEFAULT_REGION=us-east-1

          # Autenticacion directa contra ECR sin pasar por extensiones bugeadas de Node
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

      - name: Build y Push de la imagen
        run: |
          docker build -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/casino-frontend:latest .
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/casino-frontend:latest

      - name: Deploy en EC2 Frontend via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Inyeccion y limpieza de credenciales directo en el servidor remoto
            CLEAN_KEY=$(echo "${{ secrets.AWS_ACCESS_KEY_ID }}" | sed -e 's/aws_access_key_id=//g' -e 's/"//g' | tr -d '\r\n ')
            CLEAN_SECRET=$(echo "${{ secrets.AWS_SECRET_ACCESS_KEY }}" | sed -e 's/aws_secret_access_key=//g' -e 's/"//g' | tr -d '\r\n ')
            CLEAN_TOKEN=$(echo "${{ secrets.AWS_SESSION_TOKEN }}" | sed -e 's/aws_session_token=//g' -e 's/"//g' | tr -d '\r\n ')

            mkdir -p ~/.aws
            echo "[default]" > ~/.aws/credentials
            echo "aws_access_key_id=$CLEAN_KEY" >> ~/.aws/credentials
            echo "aws_secret_access_key=$CLEAN_SECRET" >> ~/.aws/credentials
            echo "aws_session_token=$CLEAN_TOKEN" >> ~/.aws/credentials
            
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
            docker stop casino-frontend || true
            docker rm casino-frontend || true
            docker pull ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/casino-frontend:latest
            docker run -d -p 80:8080 --name casino-frontend -e BACKEND_HOST=${{ secrets.BACKEND_HOST_PRIVATE }} ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/casino-frontend:latest
