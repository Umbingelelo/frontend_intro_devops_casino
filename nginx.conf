server {
    listen 8080;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html; # Esto evita el error 404 al recargar
    }

    # REVERSE PROXY: Redirige las llamadas a /api hacia el contenedor backend
    location /api/ {
        proxy_pass http://v_casino_back:3000/; # Nombre del servicio en tu docker-compose
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}